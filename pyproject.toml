[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cocosentry"
version = "0.1.0"
description = "WiFi Coconut + Coral Edge TPU security monitor"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "scapy>=2.5.0",
    "numpy>=1.24.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
coral = [
    "tflite-runtime>=2.14.0",
]
mqtt = [
    "paho-mqtt>=1.6.0",
]
tui = [
    "textual>=0.40.0",
]
training = [
    "tensorflow>=2.14.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
cocosentry = "cocosentry.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
