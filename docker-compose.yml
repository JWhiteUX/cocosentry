services:
  cocosentry:
    build:
      context: .
      target: runtime
    # privileged + host networking required for USB device access:
    # - WiFi Coconut USB adapter (802.11 monitor mode)
    # - Coral Edge TPU USB accelerator
    privileged: true
    network_mode: host
    stdin_open: true
    restart: unless-stopped
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./models:/app/models
      - cocosentry-data:/data
      - /dev/bus/usb:/dev/bus/usb

  mosquitto:
    image: eclipse-mosquitto:2
    profiles: [mqtt]
    network_mode: host
    volumes:
      - mosquitto-data:/mosquitto/data

  training:
    build:
      context: .
      target: training
    profiles: [training]
    volumes:
      - ./models:/app/models
      - cocosentry-data:/data

  dev:
    build:
      context: .
      target: dev
    profiles: [dev]

volumes:
  cocosentry-data:
  mosquitto-data:
